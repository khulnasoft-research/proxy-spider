# Enable debug-level logging (very verbose — shows detailed per-proxy checking
# output, useful for troubleshooting source parsing or check failures).
debug = false

[scraping]
# Maximum proxies to collect per source URL (0 = unlimited).
# Set lower to skip unreliable sources that yield many bad proxies.
max_proxies_per_source = 100000

# Per-request timeout and TCP connect timeout for fetching sources (seconds).
timeout = 60.0
connect_timeout = 5.0

# Optional proxy for scraping requests (e.g. "socks5://user:pass@host:port").
# Supports http, https, socks4, socks5 schemes. Leave empty to connect directly.
proxy = ""

# User-Agent header sent when fetching source lists.
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"

# Minimum delay (milliseconds) between consecutive requests to the same source.
# Useful when a source may rate-limit or ban aggressive scrapers. 0 = no delay.
rate_limit_ms = 0

[checking]
# URL used to verify each proxy works.
#
# Different URL types provide different levels of detail:
#   JSON (httpbin-compatible)  — returns {"origin":"<ip>"}. Enables ASN/geo metadata.
#   Plain IP (e.g. api.ipify)  — returns raw IP. Full functionality.
#   Any site (e.g. google.com) — basic connect/read check only.
#   "" (empty)                 — skip checking entirely (scrape only).
check_url = "https://api.ipify.org"

# How to extract the exit IP from the check URL response.
# If omitted, the schema is inferred from the check_url hostname:
#   *httpbin*, *postman*  → json { path = "origin" }
#   *ipify*              → plain_text
#   anything else         → none
#
# Available schemas:
#   [check_schema]
#   type = "json"
#   path = "origin"                          # dot-separated key path
#
#   [check_schema]
#   type = "plain_text"                      # raw IP in body
#
#   [check_schema]
#   type = "regex"
#   pattern = "(?P<host>[0-9.]+)"            # regex with "host" capture group
#
#   [check_schema]
#   type = "none"                            # connectivity only
# check_schema = { type = "plain_text" }

# Maximum concurrent proxy checks. Tune based on available RAM/network capacity
# and OS file-descriptor limits (the tool will warn and cap automatically).
max_concurrent_checks = 1024

# Per-proxy response timeout and TCP connect timeout (seconds).
# Longer timeouts find more working proxies but take longer to finish.
timeout = 60.0
connect_timeout = 5.0

# User-Agent header sent from the proxy under test to the check URL.
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"

[output]
# Output directory. Ignored when running inside Docker
# (uses $XDG_DATA_HOME/proxy_spider or OS equivalent instead).
path = "./out"

# Sort proxies by response time (true) or by IP address (false).
sort_by_speed = true

[output.txt]
enabled = true

[output.json]
enabled = true

# Embed ASN (network provider / ISP) into JSON output.
# Requires an offline MaxMind ASN database (auto-downloaded on first run).
include_asn = true

# Embed geolocation (country / city) into JSON output.
# Requires an offline MaxMind GeoIP database (auto-downloaded on first run).
include_geolocation = true

# ── Proxy sources ─────────────────────────────────────────────────────────────
# Each protocol section lists URLs (or local file paths) to scrape for proxies.
# URLs are fetched in parallel for speed.
#
# URL formats:
#   Simple string         — "./my_proxies.txt"
#   With basic auth       — { url = "…", basic_auth = { username = "u", password = "p" } }
#   With custom headers   — { url = "…", headers = { Authorization = "Bearer …" } }

[scraping.http]
enabled = true
urls = [
    # API / structured sources
    "https://api.proxyscrape.com/v3/free-proxy-list/get?request=getproxies&protocol=http",
    "https://api.proxyscrape.com/v3/free-proxy-list/get?request=getproxies&protocol=https",

    # gfpcom — largest aggregated list (~480K HTTP, ~445K HTTPS), updated hourly
    "https://raw.githubusercontent.com/wiki/gfpcom/free-proxy-list/lists/http.txt",
    "https://raw.githubusercontent.com/wiki/gfpcom/free-proxy-list/lists/https.txt",

    # komutan234 — updated every 2 minutes
    "https://raw.githubusercontent.com/komutan234/Proxy-List-Free/main/proxies/http.txt",

    # monosans — reliable, updated hourly
    "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt",

    # proxifly
    "https://raw.githubusercontent.com/proxifly/free-proxy-list/refs/heads/main/proxies/protocols/http/data.txt",
    "https://raw.githubusercontent.com/proxifly/free-proxy-list/refs/heads/main/proxies/protocols/https/data.txt",

    # roosterkid
    "https://raw.githubusercontent.com/roosterkid/openproxylist/refs/heads/main/HTTPS_RAW.txt",

    # TheSpeedX
    "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/refs/heads/master/http.txt",

    # BlackSnowDot — updated every minute
    "https://raw.githubusercontent.com/BlackSnowDot/proxylist-update-every-minute/main/http.txt",
    "https://raw.githubusercontent.com/BlackSnowDot/proxylist-update-every-minute/main/https.txt",

    # sunny9577
    "https://raw.githubusercontent.com/sunny9577/proxy-scraper/refs/heads/master/generated/http_proxies.txt",

    # zeynoxwashere
    "https://raw.githubusercontent.com/zeynoxwashere/proxy-list/main/http.txt",

    # mmpx12
    "https://raw.githubusercontent.com/mmpx12/proxy-list/master/http.txt",

    # mertguvencli
    "https://raw.githubusercontent.com/mertguvencli/http-proxy-list/main/proxy-list/data.txt",

    # Mixed-protocol sources (parser auto-detects each entry's protocol)
    "https://raw.githubusercontent.com/jetkai/proxy-list/main/online-proxies/txt/proxies.txt",
    "https://raw.githubusercontent.com/clarketm/proxy-list/master/proxy-list-raw.txt",
    "https://raw.githubusercontent.com/ShiftyTR/Proxy-List/master/proxy.txt",
]

